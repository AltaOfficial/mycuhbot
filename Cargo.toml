[package]
name = "mycuhbot"
version = "0.2.0"
authors = ["kancat", "alta"]
edition = "2021"

[dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.32.0", features = ["full"] }
# we can add postgres or mysql later if wanting to scale
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
#serenity = { version = "0.12", features = ["framework", "standard_framework", "model"] }
poise = "0.6.*" # better framework and tried to migrate but hard :/
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
once_cell = "1.19"

chrono = "0.4"
rand = "0.10.0"
